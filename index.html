<title>تعلّم الصرف</title>

<meta property="og:description" content="تطبيق تفاعلي لتعلّم علم الصرف. إعداد وتصميم: وائل الخزاعي">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F3B33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="author" content="وائل الخزاعي">
<meta name="description" content="تطبيق تفاعلي لتعليم علم الصرف العربي من الصفر إلى الدراسات العليا. إعداد وتصميم: وائل الخزاعي">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE7; --ink:#12302E; --ink2:#4B6461; --line:#CBDAD5;
  --primary:#1F7A5C; --primary-ink:#FFFFFF; --primary-soft:#D6EBE2;
  --gold:#D19A1F; --gold-deep:#9A6D0C; --gold-soft:#F7E8BF;
  --noun:#2461A8; --noun-soft:#DCE8F7;
  --verb:#B02D6B; --verb-soft:#F7DCE9;
  --part:#7042B8; --part-soft:#E8DEF7;
  --ok:#1B7F4B; --ok-soft:#D5F0E1; --bad:#B8401A; --bad-soft:#FBDDD1;
  --c-raf:#1B7F4B; --c-raf-s:#D5F0E1;
  --c-nasb:#B0680F; --c-nasb-s:#F8E6C6;
  --c-jar:#0B7F90; --c-jar-s:#D3EEF2;
  --c-jazm:#B23F32; --c-jazm-s:#F8DAD5;
  --c-root:#0B7F90; --c-root-s:#D3EEF2; --c-zaid:#C4610A; --c-zaid-s:#FBE3CC; --c-mark:#7A45C2; --fs:1;
  --bar:#0F3B33; --bar-ink:#F1F7F4; --bar-dim:#A9CDC1;
  --shadow:0 1px 2px rgba(18,48,46,.08),0 8px 22px rgba(18,48,46,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;
    --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;
    --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;
    --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;
    --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;
    --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;
    --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;
    --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;
    --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;
  --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;
  --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;
  --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;
  --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;
  --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;
  --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;
  --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;
  --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 Tajawal,system-ui,sans-serif;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--primary);font-weight:700}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font:700 24px/1.4 Amiri,serif;text-wrap:balance}
h3{font:700 15px/1.5 Tajawal,sans-serif;color:var(--ink2);margin-top:14px}
b{font-weight:700}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:700px){#app{max-width:680px;border-inline:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
#view>*{flex:none}
#tabs{flex:none;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;border-radius:12px;padding:6px 4px;color:var(--ink2);font:500 12px/1.4 Tajawal,sans-serif}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--primary);background:var(--primary-soft);font-weight:700}

/* level bar */
#lvbar{flex:none;display:flex;align-items:center;gap:12px;background:var(--bar);color:var(--bar-ink);padding:8px 16px}
#lvbar .lb-b .badge{width:48px;height:48px;display:block}
#lvbar .lb-b .badge .bt{fill:var(--gold-deep)}
#lvbar .lb-t{display:flex;flex-direction:column;min-width:0}
#lvbar small{font:500 13px/1.4 Tajawal,sans-serif;color:var(--bar-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvbar b{font:700 28px/1.6 Amiri,serif;color:var(--gold)}
#lvbar .lb-d{margin-inline-start:auto;display:flex;gap:5px;align-self:flex-end;padding-bottom:8px}
#lvbar .lb-d i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
#lvbar .lb-d i.won{background:var(--gold)}
#lvbar .lb-d i.cur{background:transparent;box-shadow:0 0 0 2px var(--gold)}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.eyebrow{font:500 13px/1.4 Tajawal,sans-serif;color:var(--ink2);letter-spacing:.04em}
.big{font:700 40px/1.4 Amiri,serif;color:var(--primary)}
.muted{color:var(--ink2)}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;font:700 17px/1.4 Tajawal,sans-serif;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:none;border:2px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.top{display:flex;align-items:center;gap:12px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--surface2);min-width:4px}
.dots i.on{background:var(--primary)}
.tag{display:inline-block;align-self:flex-start;border-radius:99px;padding:1px 14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface2)}
.credit{text-align:center;color:var(--ink2);font-size:14px;padding-top:4px}
.credit b{color:var(--ink);font-weight:700}
.tap{color:var(--ink2);font-size:14px;text-align:center}
.tap.bad{color:var(--bad);font-weight:700}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:60px}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.clue{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.bl li{background:var(--surface2);border-radius:10px;padding:8px 12px}
.sec{display:flex;flex-direction:column;gap:12px}

/* home / lists */
.steps{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.step{width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font:700 16px/1 Tajawal,sans-serif;color:var(--ink2)}
.step.done .n{background:var(--primary);color:var(--primary-ink)}
.step b{display:block;font-weight:700}
.step small{color:var(--ink2);font-size:13px}
.step .go{margin-inline-start:auto;color:var(--ink2);font-size:22px}
.journey{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.journey .lv{flex:1 1 0;min-width:54px;width:auto}
.journey .lv span{font-size:13px}
.lv{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px/1.4 Amiri,serif;text-align:center;background:none;border:0;padding:0}
.lv .badge{width:62px;height:62px}
.lcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.lcard .hd{display:flex;align-items:center;gap:12px}
.lcard .badge{width:60px;height:60px;flex:none}
.lcard h2{font-size:26px}
.lcard small{color:var(--ink2)}
.chipst{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;background:var(--surface2);color:var(--ink2)}
.chipst.ok{background:var(--gold-soft);color:var(--gold-deep)}
.chipst.rec{background:var(--primary-soft);color:var(--primary)}
.refs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.refs li{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:15px}
.refs small{display:block;color:var(--ink2)}

.badge .bs rect{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.badge .bc{fill:var(--surface);stroke:var(--line);stroke-width:2}
.badge .bt{font:800 26px Tajawal,sans-serif;fill:var(--ink2)}
.badge.on .bs rect{fill:var(--gold);stroke:var(--gold-deep)}
.badge.on .bc{fill:var(--gold-soft);stroke:var(--gold-deep)}
.badge.on .bt{fill:var(--gold-deep)}

/* words and colours */
.k-noun{color:var(--noun)} .k-verb{color:var(--verb)} .k-part{color:var(--part)}
.bg-noun{background:var(--noun-soft);color:var(--noun);border-color:var(--noun)!important}
.bg-verb{background:var(--verb-soft);color:var(--verb);border-color:var(--verb)!important}
.bg-part{background:var(--part-soft);color:var(--part);border-color:var(--part)!important}
.cc-raf{color:var(--c-raf)} .cc-nasb{color:var(--c-nasb)} .cc-jar{color:var(--c-jar)} .cc-jazm{color:var(--c-jazm)}
.cb-raf{background:var(--c-raf-s);color:var(--c-raf);border-color:var(--c-raf)!important}
.cb-nasb{background:var(--c-nasb-s);color:var(--c-nasb);border-color:var(--c-nasb)!important}
.cb-jar{background:var(--c-jar-s);color:var(--c-jar);border-color:var(--c-jar)!important}
.cb-jazm{background:var(--c-jazm-s);color:var(--c-jazm);border-color:var(--c-jazm)!important}
.sent{font:400 clamp(24px,7.4vw,32px)/2.1 Amiri,serif;display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:center;padding:6px 0}
.w{display:inline-block}
.w.hl{background:var(--gold-soft);border-radius:10px;padding:0 10px;box-shadow:inset 0 -3px 0 var(--gold)}
.w.hl.k-noun,.w.hl.k-verb,.w.hl.k-part{background:var(--surface2)}
.endhl{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold);border-radius:6px;position:relative}
.endhl.e-raf{background:var(--c-raf-s);box-shadow:inset 0 -3px 0 var(--c-raf)}
.endhl.e-nasb{background:var(--c-nasb-s);box-shadow:inset 0 -3px 0 var(--c-nasb)}
.endhl.e-jar{background:var(--c-jar-s);box-shadow:inset 0 -3px 0 var(--c-jar)}
.endhl.e-jazm{background:var(--c-jazm-s);box-shadow:inset 0 -3px 0 var(--c-jazm)}
.endhl.e-fix{background:var(--surface2);box-shadow:inset 0 -3px 0 var(--ink2)}
.endhl.gh{box-shadow:none;border-bottom:3px dashed currentColor;border-radius:4px 4px 0 0}
.endhl.gh::before{content:attr(data-m);position:absolute;left:0;right:0;top:-.7em;text-align:center;font-size:.8em;opacity:.8;line-height:1;pointer-events:none}
.bigw{font:700 clamp(40px,12vw,54px)/1.8 Amiri,serif;text-align:center}
.chip{font:400 28px/1.6 Amiri,serif;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:2px 14px;display:inline-flex;flex-direction:column;align-items:center}
.chip small{font:500 12px/1.4 Tajawal,sans-serif}
.chip.sel,.chip.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.chip.miss{border-style:dashed}
.chip.done{cursor:default}
.chip.long{font-size:22px;text-align:center}
.chip.mini{font-size:20px;padding:0 6px;border-width:1px;width:100%;justify-content:center;overflow:hidden;white-space:nowrap}
.chip.right{background:var(--ok-soft);border-color:var(--ok)!important;color:var(--ok)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad)!important;color:var(--bad)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:72px;padding:8px 6px;font-size:16px;min-height:42px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
.tw th,.tw td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tw th{background:var(--surface2);font-weight:700;white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:700}
.tw .ar{font:400 21px/1.7 Amiri,serif}
.sum{display:flex;flex-direction:column;gap:8px}
.sumrow{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.sumrow b{font:700 20px/1.5 Amiri,serif}
.sumrow span{font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:400 22px/1.6 Amiri,serif;background:var(--part-soft);color:var(--part);border-radius:99px;padding:0 14px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.detail .dw{font:700 30px/1.4 Amiri,serif}
.detail ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15px}

/* hierarchy */
.hier{overflow-x:auto;padding-bottom:4px}
.hier ul{list-style:none;margin:0;padding:0}
.hier ul ul{margin-right:14px;padding-right:14px;border-right:2px solid var(--line)}
.hier li{position:relative;padding:4px 0}
.hier ul ul>li::before{content:'';position:absolute;right:-14px;top:1.35em;width:12px;border-top:2px solid var(--line)}
.hn{display:inline-flex;flex-direction:column;border:2px solid var(--line);border-radius:12px;padding:1px 12px;background:var(--surface);max-width:100%}
.hn b{font:700 20px/1.6 Amiri,serif}
.hn small{font-size:13px;color:var(--ink2);line-height:1.5}
.hn.k-noun{border-color:var(--noun)} .hn.k-verb{border-color:var(--verb)} .hn.k-part{border-color:var(--part)}
.hn.cc-raf{border-color:var(--c-raf)} .hn.cc-nasb{border-color:var(--c-nasb)} .hn.cc-jar{border-color:var(--c-jar)} .hn.cc-jazm{border-color:var(--c-jazm)}
.hn.gold{border-color:var(--gold);background:var(--gold-soft)}
.hn.root{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.hn.root small{color:var(--primary-ink);opacity:.85}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:6px}
.fbx{flex:1 1 92px;max-width:170px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface);text-align:center;display:flex;flex-direction:column;justify-content:center}
.fbx b{font:700 19px/1.5 Amiri,serif}
.fbx small{font-size:13px;color:var(--ink2);line-height:1.5}
.fbx .ar{font:400 22px/1.5 Amiri,serif}
.fbx.k-noun{border-color:var(--noun)} .fbx.k-verb{border-color:var(--verb)} .fbx.k-part{border-color:var(--part)}
.fbx.cc-raf{border-color:var(--c-raf)} .fbx.cc-nasb{border-color:var(--c-nasb)} .fbx.cc-jar{border-color:var(--c-jar)} .fbx.cc-jazm{border-color:var(--c-jazm)}
.fbx.gold{border-color:var(--gold);background:var(--gold-soft)}
.fa{align-self:center;font-size:22px;color:var(--ink2)}

/* anatomy */
.anat{display:grid;gap:6px 6px;padding:4px 0;overflow-x:auto}
.anat .aw{font:400 clamp(20px,6vw,26px)/1.7 Amiri,serif;text-align:center;align-self:end}
.anat .af{font:700 12px/1.4 Tajawal,sans-serif;text-align:center;border-radius:8px;padding:1px 4px;border:1.5px solid var(--line);background:var(--surface2);align-self:start}
.anat .ag{font:700 13px/1.4 Tajawal,sans-serif;text-align:center;border-radius:0 0 10px 10px;border:2px solid var(--line);border-top:0;padding:1px 4px;background:var(--surface);color:var(--ink2)}

/* decision tree */
.dt{display:flex;flex-direction:column;gap:8px}
.dt .qa{background:var(--surface2);border-radius:10px;padding:6px 12px;font-size:14px}
.dt .qa b{color:var(--primary)}
.dt .cur{background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dt .cur p{font-weight:700}
.dt .res{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dt .res .rt{font:700 22px/1.5 Amiri,serif;color:var(--ok)}

/* sentence map */
.mapwrap{background:var(--surface2);border-radius:14px;padding-top:6px;overflow-x:auto}
.smap{display:block;height:auto;user-select:none;-webkit-user-select:none}
.smap.linkable{touch-action:none}
.smap .nr{fill:var(--surface);stroke:var(--line);stroke-width:2}
.smap .nr.c-noun{stroke:var(--noun)} .smap .nr.c-verb{stroke:var(--verb)} .smap .nr.c-part{stroke:var(--part)}
.smap .nt{font:400 22px Amiri,serif;fill:var(--ink)}
.smap .nk{font:700 13px Tajawal,sans-serif}
.smap .nk.k-noun{fill:var(--noun)} .smap .nk.k-verb{fill:var(--verb)} .smap .nk.k-part{fill:var(--part)}
.smap .node{cursor:pointer;outline:none}
.smap .node:focus-visible .nr{stroke:var(--primary);stroke-width:4}
.smap .node.sel .nr{stroke:var(--gold);stroke-width:4;fill:var(--gold-soft)}
.smap .node.ok .nr{fill:var(--ok-soft);stroke:var(--ok)}
.smap .node.bad .nr{fill:var(--bad-soft);stroke:var(--bad)}
.smap .node.bad{animation:shake .4s}
.smap .arc{fill:none;stroke:var(--ink2);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;animation:draw .6s ease-out}
.smap .arc.r-raf{stroke:var(--c-raf)} .smap .arc.r-nasb{stroke:var(--c-nasb)} .smap .arc.r-jar{stroke:var(--c-jar)} .smap .arc.r-jazm{stroke:var(--c-jazm)}
.smap .arc.hi{stroke-width:4}
.smap .arc.dim,.smap .albl.dim{opacity:.22}
.smap .ab{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}
.smap .ab.r-raf{stroke:var(--c-raf)} .smap .ab.r-nasb{stroke:var(--c-nasb)} .smap .ab.r-jar{stroke:var(--c-jar)} .smap .ab.r-jazm{stroke:var(--c-jazm)}
.smap .al{font:700 13px Tajawal,sans-serif;fill:var(--ink)}
.smap .al.r-raf{fill:var(--c-raf)} .smap .al.r-nasb{fill:var(--c-nasb)} .smap .al.r-jar{fill:var(--c-jar)} .smap .al.r-jazm{fill:var(--c-jazm)}
.smap .ah{fill:var(--ink2)}
.smap .ah.r-raf{fill:var(--c-raf)} .smap .ah.r-nasb{fill:var(--c-nasb)} .smap .ah.r-jar{fill:var(--c-jar)} .smap .ah.r-jazm{fill:var(--c-jazm)}
.smap .tmp{fill:none;stroke:var(--gold-deep);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* questions */
.sess{display:flex;flex-direction:column;gap:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.cnt{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.qcard{display:flex;flex-direction:column;gap:10px}
.qb{display:flex;flex-direction:column;gap:10px}
.prompt{font-weight:700;text-align:center;font-size:17px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts1{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 6px;font:700 20px/1.4 Tajawal,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opt1{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:500 17px/1.6 Tajawal,sans-serif;text-align:start;min-height:48px}
.opt1 .ar{font:400 22px/1.6 Amiri,serif}
.opt.k-noun{border-color:var(--noun)} .opt.k-verb{border-color:var(--verb)} .opt.k-part{border-color:var(--part)}
.opt .g{font:400 40px/1.3 Amiri,serif;color:var(--ink)}
.opt.mk span:last-child{font-size:16px}
.opt.right,.opt1.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong,.opt1.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt[disabled],.opt1[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong),.opt1[disabled]:not(.right):not(.wrong){opacity:.55}
.opt.ex.on,.opt1.ex.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.last.blank{border-bottom:3px dashed var(--gold-deep)}
.last.ok{color:var(--ok)} .last.bad{color:var(--bad)}
.hint{background:var(--surface2);border-radius:12px;padding:8px 14px;font-size:14px}
.hint summary{cursor:pointer;font-weight:700}
.hint p{margin-top:6px}
.fb{border-radius:14px;padding:12px 16px;margin-top:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:17px}
.fb div,.fb p,.fb ul{color:var(--ink);font-size:15px}
.fb ul{margin:6px 0 0;padding-inline-start:18px}
.fbh .btn{margin-top:12px;width:100%}
.parsed{display:flex;flex-direction:column;gap:4px}
.parsed div{background:var(--ok-soft);border-radius:10px;padding:4px 10px;font-size:14px}
.parsed div b{font:700 18px Amiri,serif}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.pw{font:400 26px/1.5 Amiri,serif;touch-action:none;cursor:grab}
.pw.bad{animation:shake .4s;border-color:var(--bad)}
.baskets{display:grid;gap:8px}
.bask{border:2px dashed var(--line);border-radius:14px;padding:8px 6px;min-height:130px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);cursor:pointer}
.bask b{font:700 18px/1.4 Tajawal,sans-serif}
.bask .in{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%}
.bask.over{background:var(--gold-soft)}
.bask.c-noun{border-color:var(--noun)} .bask.c-verb{border-color:var(--verb)} .bask.c-part{border-color:var(--part)}
.bask.c-raf{border-color:var(--c-raf)} .bask.c-nasb{border-color:var(--c-nasb)} .bask.c-jar{border-color:var(--c-jar)} .bask.c-jazm{border-color:var(--c-jazm)}
.dragghost{position:fixed;z-index:40;pointer-events:none;opacity:.92;transform:rotate(-3deg);box-shadow:var(--shadow)}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:var(--surface)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 8px;font:500 15px/1.5 Tajawal,sans-serif;min-height:48px}
.mbtn .ar{font:400 22px/1.5 Amiri,serif}
.mbtn.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.mbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mbtn.bad{animation:shake .4s;border-color:var(--bad)}

/* result / profile */
.res{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 32px/1 Tajawal,sans-serif}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .7s ease-out both}
.seal .badge{width:130px;height:130px;filter:drop-shadow(0 6px 14px rgba(209,154,31,.45))}
.seal h2{font-size:34px;color:var(--gold-deep)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.who{display:flex;align-items:center;gap:14px}
.who .badge{width:84px;height:84px;flex:none}
.who small{color:var(--ink2)}
.who h2{font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 24px/1.3 Tajawal,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;text-align:start;width:100%}
.bitem .badge{width:52px;height:52px;flex:none}
.bitem b{display:block;font:700 17px/1.4 Amiri,serif}
.bitem small{color:var(--ink2);font-size:12px;line-height:1.4;display:block}
.bitem.off{opacity:.7}
.sharecard{background:var(--bar);color:var(--bar-ink);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px}
.sharecard .badge{width:84px;height:84px;flex:none}
.sharecard .badge .bt{fill:var(--gold-deep)}
.sharecard b{font:700 24px/1.5 Amiri,serif;color:var(--gold);display:block}
.sharecard small{display:block;color:var(--bar-dim);line-height:1.6}
.copybox{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink);direction:ltr;font:14px monospace}
.rbar{display:flex;align-items:center;gap:8px;font-size:14px}
.rbar .lbl{width:78px;flex:none;font:700 15px Amiri,serif}
.rbar .meter{flex:1}
.rbar .v{width:38px;text-align:end;color:var(--ink2);font-variant-numeric:tabular-nums}

/* splash: a single deliberate look */
#splash{position:absolute;inset:0;z-index:20;background:#0F3B33;color:#F1F7F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:hidden}
#splash .bgstar{position:absolute;width:150%;max-width:800px;aspect-ratio:1;opacity:.07;left:50%;top:50%;transform:translate(-50%,-50%)}
#splash .bgstar rect{fill:none;stroke:#E3B341;stroke-width:1.2}
#splash>*{position:relative}
#splash .mark{width:120px;height:120px}
#splash .mark rect{fill:none;stroke:#E3B341;stroke-width:2.4}
#splash .mark path{fill:#E3B341}
#splash h1{font:700 52px/1.3 Amiri,serif;color:#F1F7F4}
#splash p{color:#BFD8CF;font-size:18px}
#splash .go{margin-top:10px;background:#E3B341;color:#0F3B33;border:0;border-radius:16px;padding:14px 40px;font:800 19px Tajawal,sans-serif}
#splash .by{position:absolute;bottom:22px;left:0;right:0;font-size:14px;color:#BFD8CF}
#splash .by b{color:#F1F7F4}


/* ===== sarf additions ===== */
#app{--af:1}
html{-webkit-text-size-adjust:100%}
/* manual theme override */
#app[data-mode="light"]{color-scheme:light;   --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE7; --ink:#12302E; --ink2:#4B6461; --line:#CBDAD5;   --primary:#1F7A5C; --primary-ink:#FFFFFF; --primary-soft:#D6EBE2;   --gold:#D19A1F; --gold-deep:#9A6D0C; --gold-soft:#F7E8BF;   --noun:#2461A8; --noun-soft:#DCE8F7;   --verb:#B02D6B; --verb-soft:#F7DCE9;   --part:#7042B8; --part-soft:#E8DEF7;   --ok:#1B7F4B; --ok-soft:#D5F0E1; --bad:#B8401A; --bad-soft:#FBDDD1;   --c-raf:#1B7F4B; --c-raf-s:#D5F0E1;   --c-nasb:#B0680F; --c-nasb-s:#F8E6C6;   --c-jar:#0B7F90; --c-jar-s:#D3EEF2;   --c-jazm:#B23F32; --c-jazm-s:#F8DAD5;   --c-root:#0B7F90; --c-root-s:#D3EEF2; --c-zaid:#C4610A; --c-zaid-s:#FBE3CC; --c-mark:#7A45C2; --fs:1;   --bar:#0F3B33; --bar-ink:#F1F7F4; --bar-dim:#A9CDC1;   --shadow:0 1px 2px rgba(18,48,46,.08),0 8px 22px rgba(18,48,46,.09);}
#app[data-mode="dark"]{   color-scheme:dark;   --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;   --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;   --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;   --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;   --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;   --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;   --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;   --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;   --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;   --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);}
/* morphology colour system: root = solid underline, extra = dotted underline, mark = purple */
.la{color:var(--c-root);border-bottom:3px solid var(--c-root)}
.lz{color:var(--c-zaid);border-bottom:3px dotted var(--c-zaid)}
.mk{color:var(--c-mark)}
.la .mk,.lz .mk{color:inherit}
.rw{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.rz-root{color:var(--c-root);font-weight:800;letter-spacing:.15em}
#legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;background:var(--surface);border-bottom:1px solid var(--line);padding:3px 12px;font:500 12px/1.5 Tajawal,sans-serif;color:var(--ink2)}
#legend .rw{font-size:17px;line-height:1.3}
#foot{flex:none;text-align:center;font:500 12px/1.5 Tajawal,sans-serif;color:var(--ink2);padding:3px 8px;background:var(--bg);border-top:1px solid var(--line)}
#foot b{color:var(--ink)}
.term{font:inherit;color:var(--primary);background:none;border:0;border-bottom:2px dotted var(--primary);padding:0;cursor:help;font-weight:700}
.big-sent .rw,.tile .rw{font-size:calc(30px*var(--af))}
.sent,.bigw{font-size:calc(clamp(24px,7.4vw,32px)*var(--af))}
.bigw{font-size:calc(clamp(40px,12vw,54px)*var(--af))}

/* bottom sheet */
#sheetbg{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:82%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px 22px;box-shadow:0 -8px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
#sheet h2{font-size:26px}
#sheet textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,sans-serif;resize:vertical}
input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:400 24px/1.6 Amiri,serif;text-align:center}
input.txt:focus{border-color:var(--primary);outline:none}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.tile{min-width:52px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 8px;font:400 calc(32px*var(--af))/1.9 Amiri,serif;color:var(--ink);position:relative;transition:transform .15s,border-color .15s}
.tile.a{border-color:var(--c-root);background:var(--c-root-s);color:var(--c-root)}
.tile.z{border-color:var(--c-zaid);background:var(--c-zaid-s);color:var(--c-zaid);border-style:dashed}
.tile.ok{box-shadow:0 0 0 3px var(--ok-soft)}
.tile.no{animation:shake .4s;border-color:var(--bad)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.tile small{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:700 10px/1.2 Tajawal,sans-serif}
.tile.ghost{opacity:.35}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--line);border-radius:14px;min-height:92px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bin b{font:700 14px/1.4 Tajawal,sans-serif}
.bin.root{border-color:var(--c-root)} .bin.zaid{border-color:var(--c-zaid)}
.bin .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bin .row span{font:700 30px/1.5 Amiri,serif;animation:drop .5s ease-out both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rootout{font:800 clamp(30px,10vw,44px)/1.6 Amiri,serif;color:var(--c-root);text-align:center;letter-spacing:.25em}

/* balance */
.scale{position:relative;height:150px;margin:6px 0}
.scale .beam{position:absolute;top:24px;left:6%;right:6%;height:8px;border-radius:99px;background:var(--ink2);transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 50%}
.scale .post{position:absolute;top:24px;left:50%;width:10px;height:100px;margin-left:-5px;border-radius:6px;background:var(--ink2)}
.scale .base{position:absolute;bottom:0;left:30%;right:30%;height:8px;border-radius:99px;background:var(--ink2)}
.scale.bad .beam{transform:rotate(-4deg);background:var(--bad)}
.scale.good .beam{background:var(--ok)}
.pans{display:flex;gap:8px;justify-content:center;direction:rtl}
.pan{flex:1;max-width:96px;border:2px dashed var(--line);border-radius:14px;padding:4px 2px;text-align:center;background:var(--surface);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.pan .lab{font:800 26px/1.4 Amiri,serif;color:var(--c-root)}
.pan .slot{font:700 34px/1.5 Amiri,serif;min-height:52px;color:var(--ink)}
.pan.full{border-style:solid;border-color:var(--c-root);background:var(--c-root-s)}
.wazn{font:800 clamp(34px,11vw,48px)/1.7 Amiri,serif;text-align:center}
.wazn .la,.wazn .lz{animation:pop .6s ease-out both}

/* derivation tree */
.dtree{position:relative;padding:4px 0 6px}
.dtree svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dtree svg.lines path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out .2s forwards}
.dtree .seed{margin:0 auto;width:max-content;max-width:100%;background:var(--c-root-s);border:3px solid var(--c-root);border-radius:99px;padding:0 22px;font:800 clamp(34px,10vw,46px)/1.7 Amiri,serif;color:var(--c-root);letter-spacing:.2em;position:relative}
.dtree .cats{display:grid;gap:10px;margin-top:34px;position:relative}
.dtree .cat{display:flex;flex-direction:column;gap:6px;align-items:center}
.dtree .cat h4{margin:0;font:700 14px/1.4 Tajawal,sans-serif;background:var(--surface2);border-radius:99px;padding:0 12px;border:1px solid var(--line)}
.dtree .lf{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 2px;font:400 clamp(20px,5.6vw,25px)/1.7 Amiri,serif;text-align:center;opacity:0;animation:leaf .5s ease-out forwards}
.dtree .lf.on{border-color:var(--gold);background:var(--gold-soft)}
@keyframes leaf{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}

/* factory */
.fpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fpick .btn{min-height:44px;padding:4px 14px;font:700 22px/1.5 Amiri,serif}
.fout{background:var(--surface2);border-radius:16px;padding:8px;text-align:center}

/* grid table */
.cg{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cg table{border-collapse:collapse;width:100%;min-width:0}
.cg th,.cg td{padding:3px 3px;border-bottom:1px solid var(--line);text-align:center;font:400 calc(19px*var(--af))/1.8 Amiri,serif}
.cg th{background:var(--surface2);font:700 14px/1.5 Tajawal,sans-serif;white-space:nowrap}
.cg td:first-child{font:700 14px/1.5 Amiri,serif;background:var(--surface2);white-space:nowrap}
.cg tr.on td{background:var(--gold-soft)}
.cg tr{cursor:pointer}

/* reader */
.rd{font:400 calc(clamp(26px,7.6vw,34px)*var(--af))/2.3 Amiri,serif;text-align:center;display:flex;flex-wrap:wrap;gap:0 10px;justify-content:center}
.rd button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;border-radius:6px;padding:0 4px;color:var(--ink)}
.rd button.k-noun{color:var(--noun)} .rd button.k-verb{color:var(--verb)} .rd button.k-part{color:var(--part)}
.rd button.on{background:var(--gold-soft);border-bottom-color:var(--gold)}
.an{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.an .kv{display:flex;gap:8px;font-size:15px}
.an .kv b{min-width:64px;color:var(--ink2);font-weight:500}

/* worked example */
.wk{display:flex;flex-direction:column;gap:8px}
.wk .st{background:var(--surface2);border-radius:12px;padding:10px 14px;animation:leaf .4s ease-out both}
.wk .st b{color:var(--primary)}

/* radar & bars */
.radar{display:block;width:100%;max-width:340px;margin:0 auto}
.radar .g{fill:none;stroke:var(--line);stroke-width:1}
.radar .ax{stroke:var(--line);stroke-width:1}
.radar .pl{fill:var(--c-root);fill-opacity:.25;stroke:var(--c-root);stroke-width:2.5}
.radar text{font:700 11px Tajawal,sans-serif;fill:var(--ink)}
.radar .dot{fill:var(--c-root)}
.radar .na{fill:var(--ink2);opacity:.6}

/* tools & lists */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px}
.tcard b{font:700 18px/1.4 Tajawal,sans-serif}
.tcard small{color:var(--ink2);font-size:13px;line-height:1.5}
.lst{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lst li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.lst li b{font:700 18px/1.5 Amiri,serif}
.srs{min-height:170px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.srs .q{font:700 30px/1.5 Amiri,serif;color:var(--primary)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.hintbox{background:var(--gold-soft);border-radius:12px;padding:8px 12px;font-size:15px;animation:leaf .3s ease-out both}
.reportlink{background:none;border:0;color:var(--ink2);font:500 13px/1.5 Tajawal,sans-serif;text-decoration:underline;padding:6px 0}
.dlg{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.soon{opacity:.6}
.badge-lock{opacity:.5}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app[data-rm="1"] *{animation-duration:.001s!important;transition-duration:.001s!important}
.hintwrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:8px}
.pw{font-family:Amiri,serif}
.tile.ghost{opacity:.3}
.chip.lg{font:500 16px/1.5 Tajawal,sans-serif;white-space:normal;text-align:center;padding:4px 10px}
.bask .in .chip{max-width:100%}
.wnote{margin-top:6px}
.comp{display:flex;flex-direction:column;gap:12px}
.otx{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,sans-serif;margin:8px 0}
.mdl{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mph{display:flex;flex-direction:column;gap:6px;align-items:stretch;margin-top:6px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:4px 12px}
.mrow.st{animation:leaf .4s ease-out both}
.mrow .mw{font-size:calc(clamp(28px,8vw,36px)*var(--af))}
.mlab{font:500 14px/1.5 Tajawal,sans-serif;color:var(--ink2);flex:1;min-width:0}
.marr{text-align:center;color:var(--primary);font-weight:800;line-height:1}
.tl{list-style:none;margin:0;padding:0 14px 0 0;border-inline-start:3px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;inset-inline-start:-22px;top:18px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tli{width:100%;display:flex;gap:10px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tli.on{border-color:var(--gold)}
.tli .ty{flex:none;min-width:72px;font:700 13px/1.4 Tajawal,sans-serif;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.tli b{font:700 19px/1.4 Amiri,serif;display:block}
.tli small{color:var(--ink2);font-size:13px}
.tld{padding:8px 12px;font-size:15px}
.card2{display:flex;flex-direction:column;gap:10px}
.btn.wchip,.btn.rc,.btn.pc,.btn.tc{font-family:Amiri,serif;font-size:22px}
</style>

<script type="application/json" id="d-gloss">[{"t":"الصرف","d":"علم يبحث في بنية الكلمة، أي في حروفها وحركاتها وما يطرأ عليها من زيادة أو حذف أو تغيير، وفي الأوزان التي تُصاغ عليها.","ex":"كَ{ا}تِبٌ"},{"t":"النحو","d":"علم يبحث في موقع الكلمة من الجملة وحالة آخرها (الإعراب). الصرف يسأل: كيف بُنيت الكلمة؟ والنحو يسأل: أين موقعها في الجملة؟","ex":""},{"t":"الكلمة","d":"لفظ مفرد له معنى، وهي ثلاثة أقسام: اسم وفعل وحرف.","ex":""},{"t":"الاسم","d":"كلمة تدل على إنسان أو حيوان أو نبات أو جماد أو مكان أو صفة، ولا تدل على زمن. يقبل «ال» والتنوين.","ex":"قَلَمٌ"},{"t":"الفعل","d":"كلمة تدل على حدث مقترن بزمن: ماضٍ أو حاضر أو مستقبل. يقبل «قد» وتاء التأنيث الساكنة.","ex":"كَتَبَ"},{"t":"الحرف","d":"كلمة لا يظهر معناها كاملاً إلا مع غيرها، ولا تقبل علامات الاسم ولا الفعل، مثل: في، من، على.","ex":""},{"t":"الحرف الهجائي","d":"أحد الحروف الثمانية والعشرين التي تُبنى منها الكلمات العربية، من الألف إلى الياء.","ex":""},{"t":"الحركة","d":"علامة تُوضع فوق الحرف أو تحته لتبيّن كيف يُنطق: الفتحة والضمة والكسرة.","ex":""},{"t":"الفتحة","d":"حركة على شكل خط صغير مائل فوق الحرف (ـَ)، تُنطق بصوت قريب من «a».","ex":""},{"t":"الضمة","d":"حركة على شكل واو صغيرة فوق الحرف (ـُ)، تُنطق بصوت قريب من «u».","ex":""},{"t":"الكسرة","d":"حركة على شكل خط صغير مائل تحت الحرف (ـِ)، تُنطق بصوت قريب من «i».","ex":""},{"t":"السكون","d":"علامة على شكل دائرة صغيرة (ـْ) تدل على أن الحرف ساكن، أي بلا حركة.","ex":""},{"t":"الشدة","d":"علامة (ـّ) تدل على أن الحرف حرفان: الأول ساكن والثاني متحرك، مثل: مَدَّ = مَدْدَ.","ex":""},{"t":"التنوين","d":"نون ساكنة زائدة تلحق آخر الاسم لفظاً لا خطاً، وتُكتب على شكل حركة مضاعفة: ـً ـٌ ـٍ. ويدل على أن الاسم نكرة غالباً.","ex":"كِتَابٌ"},{"t":"الجذر","d":"الحروف الأصلية التي تتكوّن منها الكلمة، ولا تسقط في تصريفها ولا في مشتقاتها. أغلب جذور العربية ثلاثية.","ex":"ك ت ب"},{"t":"الحرف الأصلي","d":"حرف من حروف الجذر؛ لا يسقط ولا يُستغنى عنه، وهو ما يقابل الفاء والعين واللام في الميزان.","ex":""},{"t":"الحرف الزائد","d":"حرف يُضاف إلى الجذر ليفيد معنى جديداً أو صيغة جديدة، وحروفه العشرة مجموعة في «سألتمونيها».","ex":"{مَ}كْتُ{و}بٌ"},{"t":"سألتمونيها","d":"عبارة تجمع الحروف العشرة التي تأتي زوائد: س، أ، ل، ت، م، و، ن، ي، ه، ا. وليس كل حرف منها زائداً دائماً؛ قد يكون أصلياً في كلمات أخرى.","ex":""},{"t":"الميزان الصرفي","d":"مقياس تُوزن به الكلمة، نضع مكان حروفها الأصلية: الفاء والعين واللام (ف ع ل)، ونُبقي الزوائد والحركات كما هي.","ex":"فَعَلَ"},{"t":"الوزن","d":"الصيغة الناتجة من وضع الكلمة في الميزان الصرفي، مثل: فَاعِلٌ ومَفْعُولٌ.","ex":"فَ{ا}عِلٌ"},{"t":"الفعل الماضي","d":"فعل يدل على حدث وقع وانتهى قبل زمن الكلام، ويقبل تاء التأنيث الساكنة (كَتَبَتْ).","ex":"كَتَبَ"},{"t":"الفعل المضارع","d":"فعل يدل على حدث حاضر أو مستقبل، ويبدأ بأحد حروف المضارعة (أنيت).","ex":"{يَ}كْتُبُ"},{"t":"فعل الأمر","d":"فعل يُطلب به حدوث شيء بعد زمن الكلام، ويقبل ياء المخاطبة (اُكْتُبِي) ونون التوكيد.","ex":"{اُ}كْتُبْ"},{"t":"حروف المضارعة","d":"الحروف الأربعة التي تكون في أول الفعل المضارع: الهمزة والنون والياء والتاء، ويجمعها «أنيت».","ex":""},{"t":"المجرد","d":"فعل ليس في ماضيه حرف زائد على حروف الجذر، مثل: كَتَبَ.","ex":"كَتَبَ"},{"t":"المزيد","d":"فعل زِيد على حروف جذره حرف أو أكثر في ماضيه، مثل: أَكْرَمَ، اِنْكَسَرَ.","ex":"{أَ}كْرَمَ"},{"t":"الثلاثي","d":"ما كانت حروفه الأصلية ثلاثة، مثل: كَتَبَ (ك ت ب).","ex":""},{"t":"الرباعي","d":"ما كانت حروفه الأصلية أربعة، مثل: دَحْرَجَ (د ح ر ج).","ex":"دَحْرَجَ"},{"t":"الاشتقاق","d":"أخذ كلمة من أخرى مع اتفاق في الحروف الأصلية والمعنى العام، مثل: كاتب ومكتوب من الجذر ك ت ب.","ex":""},{"t":"المشتق","d":"كلمة مأخوذة من جذر أو من كلمة أخرى، مثل: كاتب ومكتوب ومكتبة.","ex":""},{"t":"الجامد","d":"اسم لم يُؤخذ من فعل، ولا يُشتق منه غالباً، مثل: حَجَر، جَبَل، قَلَم.","ex":"حَجَرٌ"},{"t":"اسم الفاعل","d":"اسم مشتق يدل على من قام بالفعل، ويأتي من الثلاثي على وزن فَاعِلٌ.","ex":"كَ{ا}تِبٌ"},{"t":"اسم المفعول","d":"اسم مشتق يدل على من وقع عليه الفعل، ويأتي من الثلاثي على وزن مَفْعُولٌ.","ex":"{مَ}كْتُ{و}بٌ"},{"t":"المصدر","d":"اسم يدل على الحدث مجرداً من الزمن، مثل: كِتَابَةٌ، دَرْسٌ، فَهْمٌ.","ex":"دَرْسٌ"},{"t":"الصفة المشبهة","d":"اسم مشتق يدل على صفة ثابتة في صاحبها، مثل: كَبِيرٌ، جَمِيلٌ.","ex":"كَبِ{ي}رٌ"},{"t":"اسم المكان","d":"اسم مشتق يدل على مكان وقوع الفعل، مثل: مَكْتَبٌ، مَدْرَسَةٌ.","ex":"{مَ}كْتَبٌ"},{"t":"اسم الآلة","d":"اسم مشتق يدل على أداة يقع بها الفعل، مثل: مِفْتَاحٌ، مِكْنَسَةٌ.","ex":"{مِ}فْتَ{ا}حٌ"},{"t":"همزة الوصل","d":"همزة تُنطق في الابتداء وتسقط في الدرج (وسط الكلام): اِسْتَخْرَجَ، اِبْن، الـ.","ex":""},{"t":"التصريف","d":"تحويل الأصل الواحد إلى صيغ مختلفة لمعانٍ مقصودة، كتحويل الفعل بين الماضي والمضارع والأمر ومع الضمائر.","ex":""},{"t":"البنية","d":"الهيئة التي تكون عليها الكلمة من حروف وحركات وسكنات.","ex":""},{"t":"العائلة الاشتقاقية","d":"مجموعة الكلمات التي تشترك في جذر واحد، مثل: كَتَبَ، كَاتِبٌ، مَكْتُوبٌ، كِتَابٌ، مَكْتَبٌ.","ex":""},{"t":"الأصالة","d":"كون الحرف من حروف الجذر. عكسها الزيادة.","ex":""},{"t":"الزيادة","d":"كون الحرف مضافاً إلى الجذر. تُعرف بالتجريد: نحذف الحرف فإن بقي المعنى الأساسي فهو زائد.","ex":""},{"t":"الضمير","d":"كلمة تدل على متكلم أو مخاطب أو غائب، مثل: أنا، أنتَ، هو. ويتغير الفعل بحسبه في التصريف.","ex":""},{"t":"باب الفعل","d":"نوع الفعل الثلاثي المجرد بحسب حركة عين الماضي والمضارع، مثل: فَعَلَ يَفْعُلُ. وله ستة أبواب سنتناولها في المستوى الثاني.","ex":""},{"t":"الفاء والعين واللام","d":"الحروف الثلاثة التي نضعها مكان الحروف الأصلية في الميزان: الفاء للحرف الأول، والعين للثاني، واللام للثالث.","ex":""},{"t":"التجرد","d":"خلو الكلمة من الزوائد، أي أن كل حروفها أصلية.","ex":""},{"t":"الهمزة","d":"حرف يُكتب على ألف أو واو أو ياء أو على السطر (أ ؤ ئ ء). وهي حرف أصلي في مثل: قَرَأَ وأَكَلَ.","ex":""},{"t":"الصحيح","d":"فعل خلت حروفه الأصلية من حروف العلة (الألف والواو والياء). وهو ثلاثة أنواع: سالم ومهموز ومضعّف.","ex":"كَتَبَ"},{"t":"المعتل","d":"فعل في حروفه الأصلية حرف علة أو أكثر: مثال وأجوف وناقص ولفيف.","ex":""},{"t":"حروف العلة","d":"الألف والواو والياء. وتكثر فيها التغييرات (الإعلال).","ex":""},{"t":"السالم","d":"فعل صحيح خلت أصوله من حروف العلة والهمزة والتضعيف، مثل: كَتَبَ.","ex":""},{"t":"المهموز","d":"ما كان أحد أصوله همزة: أَخَذَ (مهموز الفاء)، سَأَلَ (العين)، قَرَأَ (اللام).","ex":""},{"t":"المضعّف","d":"الثلاثي الذي عينه ولامه من جنس واحد (مَدَّ)، والرباعي الذي فاؤه ولامه الأولى من جنس وعينه ولامه الثانية من جنس (زَلْزَلَ).","ex":""},{"t":"المثال","d":"المعتل الذي فاؤه حرف علة: وَعَدَ، يَسَرَ.","ex":""},{"t":"الأجوف","d":"المعتل الذي عينه حرف علة: قَالَ (قول)، بَاعَ (بيع).","ex":""},{"t":"الناقص","d":"المعتل الذي لامه حرف علة: دَعَا (دعو)، رَمَى (رمي).","ex":""},{"t":"اللفيف","d":"ما اجتمع فيه حرفا علة: مفروق إذا فصل بينهما حرف صحيح (وَقَى)، ومقرون إذا اجتمعا متتاليين (طَوَى).","ex":""},{"t":"اللازم","d":"فعل يكتفي بفاعله ولا يحتاج إلى مفعول به: جَلَسَ.","ex":""},{"t":"المتعدي","d":"فعل يحتاج إلى مفعول به: فَتَحَ البابَ.","ex":""},{"t":"التعدية","d":"من معاني الزيادة: جعل الفعل اللازم متعدياً: خَرَجَ ← أَخْرَجَ الكتابَ.","ex":""},{"t":"المطاوعة","d":"قبول أثر فعل آخر: كَسَرْتُهُ فانْكَسَرَ، عَلَّمْتُهُ فتَعَلَّمَ.","ex":""},{"t":"صيغ المبالغة","d":"أسماء تُحوَّل إليها صيغة فاعل للدلالة على الكثرة: فَعَّال، مِفْعَال، فَعُول، فَعِيل، فَعِل.","ex":""},{"t":"المصدر الميمي","d":"مصدر يبدأ بميم زائدة ويدل على الحدث: مَذْهَب بمعنى الذهاب، مَوْعِد بمعنى الوعد.","ex":""},{"t":"مصدر المرة","d":"مصدر يدل على وقوع الفعل مرة واحدة، ومن الثلاثي على فَعْلَة: جَلْسَة.","ex":""},{"t":"مصدر الهيئة","d":"مصدر يدل على هيئة وقوع الفعل، ومن الثلاثي على فِعْلَة: جِلْسَة.","ex":""},{"t":"اسم الزمان","d":"اسم مشتق يدل على زمان وقوع الفعل: مَوْعِد اللقاء صباحاً.","ex":""},{"t":"اسم التفضيل","d":"اسم على وزن أَفْعَل يدل على أن شيئين اشتركا في صفة وزاد أحدهما فيها: أَكْبَر.","ex":""},{"t":"المقصور","d":"اسم معرب آخره ألف لازمة: الفَتَى، مُسْتَشْفَى.","ex":""},{"t":"الممدود","d":"اسم معرب آخره همزة قبلها ألف زائدة: صَحْرَاء، سَمَاء.","ex":""},{"t":"المنقوص","d":"اسم معرب آخره ياء لازمة قبلها كسرة: القَاضِي.","ex":""},{"t":"جمع التكسير","d":"جمع يتغيّر فيه بناء المفرد: كِتَاب ← كُتُب، قَلَم ← أَقْلَام.","ex":""},{"t":"جمع القلة","d":"جمع تكسير يدل على ثلاثة إلى عشرة، وأوزانه: أَفْعُل، أَفْعَال، أَفْعِلَة، فِعْلَة.","ex":""},{"t":"جمع الكثرة","d":"جمع تكسير يدل على ما فوق العشرة في الأصل، وأوزانه كثيرة: فُعُول، فِعَال، فُعُل…","ex":""},{"t":"صيغة منتهى الجموع","d":"كل جمع تكسير بعد ألف تكسيره حرفان أو ثلاثة أوسطها ساكن: مَسَاجِد، مَصَابِيح.","ex":""},{"t":"النسب","d":"إلحاق ياء مشددة بآخر الاسم مع كسر ما قبلها للدلالة على نسبة شيء إليه: مِصْرِيّ.","ex":""},{"t":"التصغير","d":"تغيير في بنية الاسم على أوزان فُعَيْل وفُعَيْعِل وفُعَيْعِيل، للتحقير أو التقليل أو التقريب أو التحبب.","ex":""},{"t":"الإعلال","d":"تغيير يطرأ على حرف العلة بالقلب أو النقل (تسكين) أو الحذف، للتخفيف.","ex":""},{"t":"الإبدال","d":"جعل حرف مكان حرف آخر في الكلمة، ويكون في الحروف الصحيحة أيضاً: اِصْتَبَرَ ← اِصْطَبَرَ.","ex":""},{"t":"الإدغام","d":"إدخال حرف في حرف مثله أو مقارب له بحيث يصيران حرفاً واحداً مشدداً: مَدَدَ ← مَدَّ.","ex":""},{"t":"القلب المكاني","d":"تقديم بعض حروف الكلمة على بعض: جَاه أصلها وَجْه، ووزنها عَفْل.","ex":""},{"t":"الممنوع من الصرف","d":"اسم لا يقبل التنوين، ويُجر بالفتحة نيابة عن الكسرة إذا لم يُعرَّف بـ«ال» ولم يُضف.","ex":""},{"t":"الفعل الجامد","d":"فعل يلزم صورة واحدة ولا يتصرف: لَيْسَ، عَسَى، نِعْمَ، بِئْسَ.","ex":""},{"t":"نون التوكيد","d":"نون تلحق المضارع والأمر لتوكيدهما، ثقيلة (يَكْتُبَنَّ) أو خفيفة (يَكْتُبَنْ).","ex":""},{"t":"اسم الجمع","d":"اسم يدل على جماعة ولا مفرد له من لفظه: قَوْم، رَهْط، نِسَاء.","ex":""},{"t":"اسم الجنس الجمعي","d":"اسم يدل على الجنس ويُفرَّق بينه وبين واحده بالتاء أو ياء النسب: شَجَر/شَجَرَة، عَرَب/عَرَبِيّ.","ex":""},{"t":"الاشتقاق الأكبر","d":"عند ابن جني: تقليب حروف الأصل الواحد على وجوهها الستة وربطها بمعنى عام. ويسميه بعض المتأخرين «الكبير».","ex":""},{"t":"النحت","d":"أخذ كلمة من كلمتين أو أكثر: بَسْمَلَ (بسم الله)، حَوْقَلَ (لا حول ولا قوة إلا بالله).","ex":""},{"t":"المعرّب","d":"لفظ أعجمي أدخلته العرب في كلامها وأجرته على أبنيتها أو قاربت: دِرْهَم.","ex":""},{"t":"المماثلة","d":"تأثر صوت بصوت مجاور حتى يصير مثله أو قريباً منه: اِزْتَجَرَ ← اِزْدَجَرَ.","ex":""},{"t":"المخالفة","d":"تغيير أحد صوتين متماثلين إلى صوت آخر لتيسير النطق: تَقَضَّضَ ← تَقَضَّى.","ex":""},{"t":"الجذع","d":"الكلمة بعد نزع السوابق واللواحق، وهو أكبر من الجذر: «كاتب» في «والكاتبون».","ex":""},{"t":"الغموض الصرفي","d":"احتمال الكلمة المكتوبة بلا تشكيل أكثر من تحليل: كتب = كَتَبَ، كُتِبَ، كُتُب.","ex":""},{"t":"همزة القطع","d":"همزة تُنطق دائماً في الابتداء والدرج، وتُكتب عليها أو تحتها همزة: أَكْرَمَ، إِكْرَام.","ex":""}]</script>

function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a.slice()).slice(0,n);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

}

/* ---------- word engine ----------
   annotated word: {..} marks زائدة letters. clusters = base letter + its marks. */
var MKR=/[ً-ٰٟ]/;
var FA=['ف','ع','ل','ل','ل'];
function cl(a){
  var out=[],z=false,cur=null,i,ch;
  for(i=0;i<a.length;i++){
    ch=a.charAt(i);
    if(ch==='{'){z=true;}
    else if(ch==='}'){z=false;}
    else if(MKR.test(ch)&&cur){cur.t+=ch;}
    else{cur={t:ch,z:z};out.push(cur);}
  }
  return out;
}
function pl(a){return a.replace(/[{}]/g,'');}
function stripM(s){return s.replace(/[ً-ٰٟـ]/g,'');}
function base(c){return c.charAt(0);}
function Wd(a,o){
  if(o&&o.c===false){return pl(a);}
  return '<span class="rw">'+cl(a).map(function(c){
    var m=c.t.slice(1),inner=base(c.t)+(m?'<span class="mk">'+m+'</span>':'');
    return '<span class="'+(c.z?'lz':'la')+'">'+inner+'</span>';
  }).join('')+'</span>';
}
function rootLetters(a){return cl(a).filter(function(c){return !c.z;}).map(function(c){return base(c.t);});}
function zaidLetters(a){return cl(a).filter(function(c){return c.z;}).map(function(c){return c.t;});}
function waznA(a){
  var k=0;
  return cl(a).map(function(c){
    var t;
    if(c.z){t='{'+c.t+'}';}
    else{t=(FA[Math.min(k,4)])+c.t.slice(1);k++;}
    return t;
  }).join('');
}
function waznP(a){return pl(waznA(a));}
/* substitute ف ع ل of a wazn pattern (annotated) with root letters */
function applyWazn(pat,root){
  var k=0,out='',i,ch;
  for(i=0;i<pat.length;i++){
    ch=pat.charAt(i);
    if(ch==='ف'||ch==='ع'||ch==='ل'){
      out+=root[k]||ch;k++;
    }else{out+=ch;}
  }
  return out;
}
function rootKey(w){return w.r||rootLetters(w.a).join('');}
var WORDS=DB.words.map(function(w,i){
  var r=w.r||rootLetters(w.a).join('');
  return {i:i,a:w.a,p:pl(w.a),r:r,rs:r.split('').join(' '),n:r.length,w:waznP(w.a),wa:waznA(w.a),t:w.t,g:w.g,b:w.b,h:!!w.h,z:zaidLetters(w.a).length,zs:zaidLetters(w.a)};
});
function wordsBy(f){return WORDS.filter(f);}
function famOf(r){return WORDS.filter(function(w){return w.r===r;});}
function famKeys(){var s={};WORDS.forEach(function(w){s[w.r]=1;});return Object.keys(s);}
function normRoot(s){return stripM(s).replace(/[أإآؤئٱ]/g,'ء').replace(/ى/g,'ي').replace(/\s+/g,'');}
function normLetters(s){return stripM(s).replace(/[أإآٱ]/g,'ا').replace(/[ؤئ]/g,'ء').replace(/ى/g,'ي').replace(/\s+/g,'');}
function sp(r){return r.split('').join(' ');}

/* ---------- glossary term cards ---------- */
var GL={};DB.gloss.forEach(function(g){GL[g.t]=g;});
function T(k,label){return '<button class="term" data-t="'+esc(k)+'">'+(label||k)+'</button>';}
/* tx: [[term]] or [[term|label]] → term card; ⟪word⟫ → coloured word */
function tx(s){
  return String(s==null?'':s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(_,k,l){return T(k,l);})
    .replace(/⟪([^⟫]+)⟫/g,function(_,a){return Wd(a);});
}
function Z(a,o){return Wd(a,o);}

/* ---------- state ---------- */
var KEY='darb-sarf-v1';
function fresh(){return {tp:{},tm:{},m:{},best:{},solved:0,rec:null,plc:null,lastDay:'',streak:0,lastLv:0,sk:{},mist:[],fav:{},notes:{},srs:{},set:{fs:1,rm:0,leg:1,mode:'auto'},hints:0};}

try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));S.set=Object.assign(fresh().set,S.set||{});}}catch(e){}

function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayNum(){return Math.floor(Date.now()/86400000);}
function touchDay(){
  var t=today();
  if(S.lastDay===t){return;}
  var y=new Date();y.setDate(y.getDate()-1);
  var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=(S.lastDay===ys)?(S.streak||0)+1:1;
  S.lastDay=t;
}
function levelTopics(lv){return CONTENT[lv]?CONTENT[lv].topics:[];}
function topicsDone(lv){var n=0;levelTopics(lv).forEach(function(t){if(S.tp[t.id]){n++;}});return n;}

function highest(){var h=-1;for(var i=0;i<LEVELS.length;i++){if(earned(i)){h=i;}}return h;}
function skillStat(id){var s=S.sk[id];return s&&s[1]?s[0]/s[1]:null;}
function recSkill(sk,ok){if(!sk){return;}var s=S.sk[sk]||(S.sk[sk]=[0,0]);s[1]++;if(ok){s[0]++;}}
function recMist(q,ok){
  if(!q||q.noMist){return;}
  var key=q.id||JSON.stringify([q.t,q.p,q.word,q.a]);
  S.mist=S.mist.filter(function(m){return m.k!==key;});
  if(!ok){S.mist.unshift({k:key,q:q,d:dayNum()});S.mist=S.mist.slice(0,60);}
}

/* ================= question generators (variants) ================= */
var GEN={};
var PARTS=['فِي','مِنْ','عَلَى','إِلَى','عَنْ','لَمْ','هَلْ','لَنْ','ثُمَّ','بَلْ','قَدْ','لَا'];
var SAL='سألتمونيها';
function isVerb(w){return w.t.indexOf('فعل')===0;}
function isPast(w){return w.t==='فعل ماضٍ';}
function fw(o){
  var f=o.f||'all',L=WORDS.filter(function(w){return o.hard?true:!w.h;});
  if(f==='tri'){L=L.filter(function(w){return w.n===3;});}
  else if(f==='zaid'){L=L.filter(function(w){return w.z>0&&w.n>=3;});}
  else if(f==='plain'){L=L.filter(function(w){return w.z===0;});}
  else if(f==='verbs'){L=L.filter(isVerb);}
  else if(f==='past'){L=L.filter(isPast);}
  else if(f==='names'){L=L.filter(function(w){return !isVerb(w);});}
  else if(f==='quad'){L=L.filter(function(w){return w.n===4&&isPast(w);});}
  else if(f==='tzaid'){L=L.filter(function(w){return w.z>0&&w.n===3;});}
  return L;
}
function take(L,n){
  var a=shuffle(L.slice()),out=[];
  while(out.length<n&&a.length){out.push(a.shift());}
  while(out.length<n&&L.length){out.push(rnd(L));}
  return out;
}
function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x);}});return o;}
function fillOpts(correct,cands,n){
  var opts=[correct];
  shuffle(cands.slice()).forEach(function(c){if(opts.length<n&&opts.indexOf(c)<0){opts.push(c);}});
  return opts;
}
function withA(opts,correct){var s=shuffle(opts.slice());return {o:s,a:s.indexOf(correct)};}
function waznExplain(w){
  return 'جذر '+Wd(w.a)+' هو «'+sp(w.r)+'»'+(w.z?'، والزوائد: '+w.zs.map(function(z){return '«'+base(z)+'»';}).join('، '):'، ولا زوائد فيه')+'. نضع «ف ع ل» مكان الأصلية ونُبقي الزوائد والحركات: '+Wd(w.wa)+'.';
}

/* 1. جذر: اختيار من متعدد */
GEN.root=function(o){
  return take(fw(o),o.n||6).map(function(w){
    var rl=w.r.split(''),ds=[];
    var zb=w.zs.map(base);
    if(zb.length){var r2=rl.slice();r2[Math.floor(Math.random()*r2.length)]=rnd(zb);ds.push(r2.join(''));}
    if(rl.length>=3){var r3=rl.slice();var t=r3[0];r3[0]=r3[1];r3[1]=t;ds.push(r3.join(''));}
    if(zb.length){ds.push(normLettersJoin(w));}
    ds.push(rnd(WORDS.filter(function(x){return x.n===w.n&&x.r!==w.r;})).r);
    ds.push(rnd(WORDS.filter(function(x){return x.n===w.n&&x.r!==w.r;})).r);
    var opts=fillOpts(w.r,uniq(ds).filter(function(d){return d!==w.r;}),4).map(sp);
    var x=withA(opts,sp(w.r));
    return {t:'choice',big:w.p,p:'ما جذر هذه الكلمة؟',o:x.o,a:x.a,sk:o.sk||'r',fix:false,word:w.a,
      why:'الجذر «'+sp(w.r)+'»'+(w.z?'؛ أما '+w.zs.map(function(z){return '«'+base(z)+'»';}).join(' و')+(w.z>1?' فزائدان':' فزائد')+' لأن '+(w.z>1?'كلاً منهما':'الحرف')+' يسقط عند التجريد.':'، وكل حروفها أصلية.')+' '+Wd(w.a)};
  });
};
function normLettersJoin(w){return cl(w.a).map(function(c){return base(c.t);}).join('').replace(/ة$/,'');}

/* 2. جذر: كتابة */
GEN.rootIn=function(o){
  return take(fw(o),o.n||5).map(function(w){return {t:'input',word:w.a,sk:o.sk||'r',why:'الجذر «'+sp(w.r)+'».'};});
};
/* 3. لمس الأصلية أو الزائدة */
GEN.letters=function(o){
  var mode=o.mode||'root';
  var L=mode==='zaid'?fw({f:'zaid'}):fw(o);
  return take(L,o.n||5).map(function(w){
    return {t:'letters',word:w.a,mode:mode,sk:o.sk||(mode==='zaid'?'z':'r'),
      why:mode==='zaid'?'الزوائد تسقط عند التجريد، فتبقى «'+sp(w.r)+'».':'الأصلية هي الجذر «'+sp(w.r)+'».'};
  });
};

    var opts=[0,1,2,3].map(function(i){return num(i);});
    var a=w.z;return {t:'choice',big:w.p,p:'كم حرفاً زائداً في هذه الكلمة؟',o:opts,a:a,fix:true,sk:'z',word:w.a,
      why:'الجذر «'+sp(w.r)+'» ← '+(w.z?'الزوائد: '+w.zs.map(function(z){return '«'+base(z)+'»';}).join('، '):'لا زوائد')+'. '+Wd(w.a)};
  });
};
/* 5. صواب/خطأ: هل هذا الحرف زائد؟ */
GEN.isZaid=function(o){
  return take(fw({f:'all'}).filter(function(w){return w.n>=3;}),o.n||6).map(function(w){
    var cs=cl(w.a),ix=[];
    cs.forEach(function(c,i){if(SAL.indexOf(base(c.t))>=0){ix.push(i);}});
    var i=ix.length?rnd(ix):Math.floor(Math.random()*cs.length),c=cs[i],ltr=base(c.t);
    var why=c.z?'«'+ltr+'» زائد في «'+w.p+'» لأنه يسقط عند التجريد؛ الجذر «'+sp(w.r)+'».'
      :'«'+ltr+'» أصلي في «'+w.p+'»'+(SAL.indexOf(ltr)>=0?'، مع أنه من حروف «سألتمونيها»، لأنه لا يسقط في كلمات عائلته؛ الجذر «'+sp(w.r)+'».':'؛ الجذر «'+sp(w.r)+'».');
    return {t:'choice',big:w.p,p:'الحرف «'+ltr+'» (الحرف رقم '+num(i+1)+') في هذه الكلمة حرف زائد. أصواب أم خطأ؟',o:['صواب','خطأ'],a:c.z?0:1,fix:true,sk:'z',word:w.a,why:why+' '+Wd(w.a)};
  });
};
/* 6. وزن: اختيار */
GEN.wazn=function(o){
  return take(fw(o),o.n||6).map(function(w){
    var ds=uniq(WORDS.filter(function(x){return x.w!==w.w&&x.n===w.n;}).map(function(x){return x.w;}));
    var near=ds.filter(function(d){return Math.abs(d.length-w.w.length)<=2;});
    var opts=fillOpts(w.w,shuffle(near.length>=3?near:ds),4);
    var x=withA(opts,w.w);
    return {t:'choice',big:w.p,p:'ما وزن هذه الكلمة في الميزان الصرفي؟',o:x.o,a:x.a,sk:'wz',word:w.a,why:waznExplain(w)};
  });
};

GEN.bal=function(o){

/* 8. نوع الفعل */
GEN.vkind=function(o){
  var K=[['فعل ماضٍ','ماضٍ'],['فعل مضارع','مضارع'],['فعل أمر','أمر']];

    'فعل ماضٍ':'دلّ على حدث انتهى، ويقبل تاء التأنيث الساكنة (كَتَبَتْ).',

  return take(fw({f:'verbs'}).filter(function(w){return !w.h&&w.z<=1||w.t!=='فعل ماضٍ';}),o.n||6).map(function(w){
    return {t:'choice',big:w.p,p:'ما نوع هذا الفعل؟',o:K.map(function(k){return k[0];}),a:K.map(function(k){return k[0];}).indexOf(w.t),fix:true,sk:'v',word:w.a,why:why[w.t]+' '+Wd(w.a)};
  });

/* 9. تحويل بين الأزمنة */
GEN.conv=function(o){
  var keys=famKeys().filter(function(r){
    var f=famOf(r);return f.some(isPast)&&f.some(function(w){return w.t==='فعل مضارع';});
  });
  var pairs=[['فعل ماضٍ','فعل مضارع','المضارع'],['فعل مضارع','فعل ماضٍ','الماضي'],['فعل ماضٍ','فعل أمر','الأمر'],['فعل مضارع','فعل أمر','الأمر']];
  var out=[],tries=0;
  while(out.length<(o.n||6)&&tries<100){
    tries++;
    var r=rnd(keys),f=famOf(r),pr=rnd(o.pairs?o.pairs.map(function(i){return pairs[i];}):pairs);
    var a=f.filter(function(w){return w.t===pr[0];})[0],b=f.filter(function(w){return w.t===pr[1];})[0];
    if(!a||!b){continue;}
    var cands=WORDS.filter(function(w){return w.t===pr[1]&&w.r!==r&&!w.h&&w.z===b.z&&Math.abs(w.p.length-b.p.length)<=1;}).map(function(w){return w.p;});
    if(cands.length<3){cands=WORDS.filter(function(w){return w.t===pr[1]&&w.r!==r&&!w.h;}).map(function(w){return w.p;});}
    var opts=fillOpts(b.p,uniq(cands),4),x=withA(opts,b.p);
    out.push({t:'choice',big:a.p,p:'حوّل هذا الفعل ('+pr[0].replace('فعل ','')+') إلى صيغة '+pr[2]+':',o:x.o,a:x.a,sk:'v',
      why:Wd(a.a)+' ← '+Wd(b.a)+'. '+(pr[1]==='فعل مضارع'?'أضفنا حرف المضارعة وسكّنّا الفاء، وحركة العين تتبع باب الفعل.':pr[1]==='فعل أمر'?'حذفنا حرف المضارعة وسكّنّا الآخر، وابتدأنا بهمزة الوصل.':'حذفنا حرف المضارعة وفتحنا الفاء، وضبطنا العين على وزن الماضي.')});
  }
  return out;
};

      why:(w.z?'مزيد: زِيد على جذره «'+sp(w.r)+'» '+w.zs.map(function(z){return '«'+z+'»';}).join(' و'):'مجرد: كل حروفه أصلية «'+sp(w.r)+'»')+'. '+Wd(w.a)};

/* 12. الدخيل على العائلة */
GEN.odd=function(o){
  var keys=famKeys().filter(function(r){return famOf(r).filter(function(w){return !w.h;}).length>=4;});
  var out=[];
  for(var i=0;i<(o.n||4);i++){
    var r=rnd(keys),f=shuffle(famOf(r).filter(function(w){return !w.h;})).slice(0,3);
    var r2=rnd(keys.filter(function(k){return k!==r;})),odd=rnd(famOf(r2).filter(function(w){return !w.h;}));
    var opts=f.map(function(w){return w.p;}).concat([odd.p]),x=withA(opts,odd.p);
    out.push({t:'choice',p:'ثلاث كلمات من عائلة جذر واحد، وواحدة دخيلة. أيّها الدخيلة؟',o:x.o,a:x.a,sk:'r',
      why:'الكلمات الثلاث من الجذر «'+sp(r)+'»، أما «'+odd.p+'» فجذرها «'+sp(odd.r)+'».'});
  }
  return out;
};
/* 13. صياغة على وزن */
GEN.factory=function(o){
  var L=WORDS.filter(function(w){return !isVerb(w)&&!w.h&&w.n===3&&famOf(w.r).length>=3;}),out=[];
  take(L,o.n||5).forEach(function(w){
    var cands=uniq(WORDS.filter(function(x){return x.r===w.r&&x.p!==w.p;}).map(function(x){return x.p;}));
    var oth=uniq(WORDS.filter(function(x){return x.r!==w.r&&x.w===w.w;}).map(function(x){return x.p;}));
    var opts=fillOpts(w.p,uniq(cands.concat(oth)),4);
    if(opts.length<3){return;}
    var x=withA(opts,w.p);
    out.push({t:'choice',p:'أيّ كلمة من جذر «'+sp(w.r)+'» وعلى وزن «'+w.w+'»؟',o:x.o,a:x.a,sk:'wz',
      why:'وضعنا الجذر «'+sp(w.r)+'» في الميزان «'+w.w+'» فخرجت: '+Wd(w.a)+'.'});
  });
  return out;
};
/* 14. تمييز الكلمة */
GEN.kind=function(o){

  });

/* 15. اسم فاعل/مفعول/غيره */
GEN.dkind=function(o){
  var L=WORDS.filter(function(w){return !w.h&&['اسم فاعل','اسم مفعول','مصدر','اسم مكان','صفة مشبهة','اسم آلة'].indexOf(w.t)>=0;});
  var K=['اسم فاعل','اسم مفعول','مصدر','اسم مكان'];
  return take(L.filter(function(w){return K.indexOf(w.t)>=0;}),o.n||5).map(function(w){
    return {t:'choice',big:w.p,p:'ما نوع هذا الاسم؟',o:K,a:K.indexOf(w.t),fix:true,sk:'d',word:w.a,why:Wd(w.a)+' وزنها '+Wd(w.wa)+' ← '+w.t+'.'};
  });
};

/* 16. عدّ الحروف */
GEN.nlet=function(o){
  return take(fw({f:'all'}).filter(function(w){return cl(w.a).length<=7;}),o.n||6).map(function(w){
    var n=cl(w.a).length,opts=[n-1,n,n+1,n+2].filter(function(x){return x>=2;}).slice(0,4);
    while(opts.length<4){opts.push(opts[opts.length-1]+1);}
    return {t:'choice',big:w.p,p:'كم حرفاً في هذه الكلمة؟ (لا نعدّ الحركات، والشدة والتنوين ليسا حرفين مستقلين هنا)',o:opts.map(num),a:opts.indexOf(n),fix:true,sk:'w',why:'الحروف: '+cl(w.a).map(function(c){return base(c.t);}).join('، ')+' = '+num(n)+'.'};
  });
};
/* 17. اسم الحركة */
GEN.markq=function(o){
  var MN={'\u064E':'فتحة','\u064F':'ضمة','\u0650':'كسرة','\u0652':'سكون'},out=[];
  take(fw({f:'all'}),(o.n||6)*2).forEach(function(w){
    if(out.length>=(o.n||6)){return;}
    var cs=cl(w.a),ix=[];
    cs.forEach(function(c,i){if(c.t.length===2&&MN[c.t.charAt(1)]){ix.push(i);}});
    if(!ix.length){return;}
    var i=rnd(ix),c=cs[i],ORDN=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع'];
    var right=MN[c.t.charAt(1)];
    out.push({t:'choice',big:w.p,p:'ما العلامة على الحرف '+ORDN[i]+' («'+base(c.t)+'») في هذه الكلمة؟',o:['فتحة','ضمة','كسرة','سكون'],a:['فتحة','ضمة','كسرة','سكون'].indexOf(right),fix:true,sk:'w',why:'الحرف «'+base(c.t)+'» عليه '+right+': '+c.t+'.'});
  });
  return out;
};

/* generic data generator: {gen:'data',d:ARRAY,n:6,f:function(item,arr){return question}} */
GEN.data=function(o){
  var out=[];
  take(o.d,Math.min(o.n||6,o.d.length)).forEach(function(it){var q=o.f(it,o.d);if(q){if(o.sk&&!q.sk){q.sk=o.sk;}out.push(q);}});
  return out;
};
/* k distinct values of field from other items, different from item's */
function alt(arr,it,key,k){
  var v=typeof key==='function'?key:function(x){return x[key];};
  return uniq(shuffle(arr.filter(function(x){return v(x)!==v(it);}).map(v))).slice(0,k||3);
}
function choiceQ(p,right,wrongs,why,x){var o=[right].concat(wrongs.filter(function(w){return w!==right;})),s=shuffle(o.slice());var q={t:'choice',p:p,o:s,a:s.indexOf(right),why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}

/* expand pool descriptors into questions */
function expand(pool){
  var out=[];
  pool.forEach(function(q){
    if(q.gen){var f=GEN[q.gen];if(f){f(q).forEach(function(x){if(q.tp){x.tp=q.tp;}out.push(x);});}}
    else{out.push(q);}
  });
  return out;
}

/* question helpers for content */
function C(p,o,a,why,x){var q={t:'choice',p:p,o:o,a:a,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function TF(p,truth,why,x){var q={t:'choice',p:p,o:['صواب','خطأ'],a:truth?0:1,fix:true,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function MATCH(p,pairs,why,x){var q={t:'match',p:p,pairs:pairs,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function SORT(p,b,w,why,x){var q={t:'sort',p:p,b:b,w:w,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function ORDER(p,w,why){return {t:'order',p:p,w:w,why:why};}
function TAP(p,s,a,why){return {t:'tap',p:p,s:s,a:a,why:why};}
function LET(word,mode,why,x){var q={t:'letters',word:word,mode:mode,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function INP(word,why,x){var q={t:'input',word:word,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function Q(p,r,w,why,x){return C(p,[r].concat(w.split('|')),0,why,x);}
function OPEN(p,model,x){var q={t:'open',p:p,model:model};if(x){for(var k in x){q[k]=x[k];}}return q;}
function BAL(word,why,x){var q={t:'balance',word:word,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}

function autoHints(q){
  if(q.hh){return q.hh;}
  var w=q.word;if(!w){return null;}
  var r=rootLetters(w),z=zaidLetters(w),rs=r.join('');
  var e=WORDS.filter(function(x){return x.a===w;})[0];if(e){rs=e.r;}
  if(q.t==='balance'||(q.t==='choice'&&q.sk==='wz')){
    return ['الميزان يضع الفاء والعين واللام مكان الحروف الأصلية، وتبقى الزوائد والحركات كما هي.','ابدأ باستخراج الجذر: احذف الحروف الزائدة أولاً.','الجذر هو: '+sp(rs)+(z.length?'، والزوائد: '+z.map(function(x){return base(x);}).join('، '):'، ولا زوائد فيها.')];
  }
  if(q.t==='letters'&&q.mode==='zaid'){
    return ['الحرف الزائد يسقط إذا جرّدنا الكلمة إلى أصلها.','الزوائد عشرة حروف مجموعة في «سألتمونيها».','في الكلمة '+num(z.length)+(z.length===1?' حرف زائد.':' حروف زائدة.')];
  }
  if(q.t==='letters'||q.t==='input'||q.sk==='r'){
    return ['فكّر في كلمات من العائلة نفسها: أيّ الحروف تبقى ثابتة فيها كلها؟','احذف الحروف التي من «سألتمونيها» إن كان حذفها لا يغيّر أصل المعنى.','عدد حروف الجذر '+num(rs.length)+'، وأوله «'+rs.charAt(0)+'».'];
  }
  return null;
}

function mountQ(host,q,o){
  o=o||{};
  var st={done:false,hints:0,idk:false};
  var hh=o.noHint?null:autoHints(q);
  host.innerHTML='<div class="qb"></div>'+(hh?'<div class="hintwrap"><div class="hintbox" hidden></div><button class="btn ghost sm hb">تلميح</button></div>':'')+(o.idk?'<button class="btn ghost wide idk">لا أعرف</button>':'')+'<div class="fbh" aria-live="polite"></div>';
  var qb=$('.qb',host),fh=$('.fbh',host);
  qb.innerHTML=Types[q.t].html(q,st);
  var hb=$('.hb',host);
  if(hb){
    hb.textContent='تلميح (١/٣)';
    hb.onclick=function(){
      if(st.done){return;}
      var box=$('.hintbox',host);box.hidden=false;
      box.innerHTML=hh.slice(0,st.hints+1).map(function(h,i){return '<div><b>'+num(i+1)+'.</b> '+tx(h)+'</div>';}).join('');
      st.hints++;S.hints=(S.hints||0)+1;save();
      hb.textContent=st.hints>=hh.length?'لا مزيد من التلميحات':'تلميح ('+num(st.hints+1)+'/'+num(hh.length)+')';
      if(st.hints>=hh.length){hb.disabled=true;}
    };
  }
  function fin(ok,msg,why){
    if(st.done){return;}
    st.done=true;
    if(hb){hb.hidden=true;}
    var ib=$('.idk',host);if(ib){ib.hidden=true;}
    if(!o.silent){
      fh.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?(st.hints?'أحسنت! أصبتَ بمساعدة التلميح':'أحسنت! إجابة صحيحة'):'ليست هذه الإجابة')+'</b>'+(msg?'<div>'+tx(msg)+'</div>':'')+(why?'<div>'+tx(why)+'</div>':'')+'</div>'+
        (o.nextLabel?'<button class="btn primary" id="nextq">'+o.nextLabel+'</button>':'')+
        (o.retry&&!ok?'<button class="btn ghost" id="retryq">أعد المحاولة</button>':'')+
        (o.report!==false&&!o.noReport?'<button class="reportlink" id="rep">أبلغ عن خطأ في هذا السؤال</button>':'');
      var nb=$('#nextq',fh);
      if(nb){nb.onclick=function(){if(o.onNext){o.onNext(ok);}};try{nb.scrollIntoView({block:'nearest'});}catch(e){}}
      var rb=$('#retryq',fh);
      if(rb){rb.onclick=function(){mountQ(host,q,o);};}
      var rp=$('#rep',fh);
      if(rp){rp.onclick=function(){if(window.__report){window.__report(q);}};}
    }
    if(o.onEnd){o.onEnd(ok,st);}
  }
  var ib2=$('.idk',host);
  if(ib2){ib2.onclick=function(){if(st.done){return;}st.idk=true;fin(false,'','');};}
  Types[q.t].bind(q,st,qb,fin);
  return st;
}

  });
}

/* ---- sort: baskets ---- */
Types.sort={
  html:function(q){
    var B=q.b;
    return '<p class="prompt">'+tx(q.p||'صنّف الكلمات: اسحب كل كلمة إلى سلّتها، أو المسها ثم المس السلّة')+'</p><div class="pool"></div>'+
      '<div class="baskets" style="grid-template-columns:repeat('+(B.length>3?2:B.length)+',1fr)">'+B.map(function(b){
        return '<div class="bask" data-k="'+b.id+'" role="button" tabindex="0"><b>'+b.n+'</b><div class="in"></div></div>';
      }).join('')+'</div><div class="tap sh">'+(q.h||'')+'</div>';
  },
  bind:function(q,st,qb,fin){
    var B=q.b,pool=$('.pool',qb),app=document.getElementById('app'),sh=$('.sh',qb);
    var left=q.w.length,mist=0,sel=null,BN={};
    B.forEach(function(b){BN[b.id]=b.n;});
    pool.innerHTML=shuffle(q.w.map(function(_,i){return i;})).map(function(i){return '<button class="chip pw'+(q.w[i].t.length>10?' lg':'')+'" data-i="'+i+'">'+q.w[i].t+'</button>';}).join('');
    function chipEl(i){return pool.querySelector('.pw[data-i="'+i+'"]');}
    function select(i){sel=i;$$('.pw',pool).forEach(function(c){c.classList.toggle('sel',+c.dataset.i===i);});}
    function assign(i,k){
      var el=chipEl(i);if(!el||st.done){return;}
      if(q.w[i].b===k){
        el.remove();select(null);sh.className='tap sh';sh.textContent='أحسنت!';
        $('.bask[data-k="'+k+'"] .in',qb).insertAdjacentHTML('beforeend','<span class="chip mini'+(q.w[i].t.length>10?' lg':'')+'">'+q.w[i].t+'</span>');
        left--;
        if(left===0){
          fin(mist<=1,mist?'عدد المحاولات الخاطئة: '+num(mist):'','<ul>'+q.w.map(function(x){return '<li><b>'+x.t+'</b> ← '+BN[x.b]+(x.n?': '+tx(x.n):'')+'</li>';}).join('')+'</ul>'+(q.why?'<div>'+q.why+'</div>':''));
        }
      }else{
        mist++;el.classList.add('bad');setTimeout(function(){el.classList.remove('bad');},500);
        sh.className='tap bad sh';sh.textContent='ليست هذه السلّة. فكّر مرة أخرى.';
      }
    }
    var drag=null,ghost=null;
    function basketAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.bask'):null;}
    function clearOver(){$$('.bask.over',qb).forEach(function(b){b.classList.remove('over');});}
    pool.addEventListener('pointerdown',function(e){
      var c=e.target.closest('.pw');if(!c){return;}
      drag={i:+c.dataset.i,x:e.clientX,y:e.clientY,moved:false,el:c};
      try{c.setPointerCapture(e.pointerId);}catch(x){}
    });
    pool.addEventListener('pointermove',function(e){
      if(!drag){return;}
      if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
        drag.moved=true;ghost=drag.el.cloneNode(true);ghost.classList.add('dragghost');app.appendChild(ghost);drag.el.style.opacity='.35';
      }
      if(drag.moved){
        ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(e.clientY-ghost.offsetHeight-14)+'px';
        clearOver();var b=basketAt(e);if(b){b.classList.add('over');}
      }
    });
    function end(e,cancel){
      if(!drag){return;}
      var d=drag;drag=null;
      if(ghost){ghost.remove();ghost=null;}
      d.el.style.opacity='';clearOver();
      if(cancel){return;}
      if(d.moved){var b=basketAt(e);if(b){assign(d.i,b.dataset.k);}}
      else{select(sel===d.i?null:d.i);}
    }
    pool.addEventListener('pointerup',function(e){end(e,false);});
    pool.addEventListener('pointercancel',function(e){end(e,true);});
    pool.addEventListener('click',function(e){var c=e.target.closest('.pw');if(c&&e.detail===0){select(sel===+c.dataset.i?null:+c.dataset.i);}});
    $$('.bask',qb).forEach(function(b){
      function go2(){if(sel!=null){assign(sel,b.dataset.k);}}
      b.onclick=go2;
      b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go2();}};
    });
  }
};

/* ---- letters: tap the root / extra letters of a word ---- */

    }

/* ---------- settings, legend ---------- */
function applySet(){
  app.setAttribute('data-mode',S.set.mode||'auto');

/* ---------- bottom sheet ---------- */
var sheetBg=$('#sheetbg'),sheet=$('#sheet');
function openSheet(html,after){
  sheet.innerHTML='<div class="grab"></div>'+html+'<button class="btn ghost" id="sclose">إغلاق</button>';
  sheetBg.hidden=false;
  $('#sclose').onclick=closeSheet;
  if(after){after(sheet);}
}
function closeSheet(){sheetBg.hidden=true;sheet.innerHTML='';}
sheetBg.addEventListener('click',function(e){if(e.target===sheetBg){closeSheet();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheetBg.hidden){closeSheet();}});

function copyText(text,box,okMsg){
  function fallback(){box.innerHTML='<textarea class="copybox" rows="5" readonly aria-label="النص">'+esc(text)+'</textarea>';var t=box.querySelector('textarea');t.focus();t.select();}
  try{navigator.clipboard.writeText(text).then(function(){box.textContent=okMsg||'تم النسخ.';},fallback);}catch(e){fallback();}
}

/* term cards */
function openTerm(k){
  var g=GL[k];
  if(!g){return;}
  var ex=g.ex?(/\s/.test(g.ex)?'<div class="rootout" style="font-size:30px">'+g.ex+'</div>':'<div class="bigw" style="text-align:center">'+Wd(g.ex)+'</div>'):'';
  var fav=!!S.fav['g:'+k],inS=!!S.srs['g:'+k];
  openSheet('<h2>'+g.t+'</h2><p>'+tx(g.d)+'</p>'+ex+
    '<div class="row2"><button class="btn ghost" id="tf">'+(fav?'★ في المفضلة':'☆ أضف إلى المفضلة')+'</button><button class="btn ghost" id="ts">'+(inS?'في بطاقات التكرار ✓':'أضف إلى بطاقات التكرار')+'</button></div>',function(){
    $('#tf').onclick=function(){if(S.fav['g:'+k]){delete S.fav['g:'+k];}else{S.fav['g:'+k]=1;}save();openTerm(k);};
    $('#ts').onclick=function(){if(!S.srs['g:'+k]){S.srs['g:'+k]={b:0,d:dayNum()};save();}openTerm(k);};
  });
}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.term');if(t){e.preventDefault();openTerm(t.dataset.t);}});

/* error report */
window.__report=function(q,ctx){
  var c=ctx||(q?('سؤال: '+(q.t||'')+' | '+(q.word||'')+' | '+String(q.p||'').replace(/<[^>]*>/g,'').slice(0,90)+' | '+String(q.why||'').replace(/<[^>]*>/g,'').slice(0,120)):'عام');
  openSheet('<h2>الإبلاغ عن خطأ</h2><p class="muted">صِف الخطأ (علمي أو لغوي أو تقني) وسنراجعه. لا نجمع أي بيانات شخصية؛ النص أدناه تنسخه أنت وترسله.</p>'+
    '<textarea id="rtx" placeholder="ما الخطأ الذي وجدته؟"></textarea><div class="tap" style="font-size:13px">السياق: '+esc(c)+'</div>'+
    '<button class="btn primary" id="rcp">انسخ البلاغ</button>'+(DB.refs.reportEmail?'<a class="btn ghost" id="rml" style="text-align:center" href="#">أرسله بالبريد</a>':'')+'<div id="rms" class="muted"></div>',function(){
    function body(){return 'تعلّم الصرف — بلاغ خطأ\nالسياق: '+c+'\nالوصف: '+$('#rtx').value;}
    $('#rcp').onclick=function(){copyText(body(),$('#rms'),'تم نسخ البلاغ. أرسله إلى القائمين على التطبيق.');};
    if($('#rml')){$('#rml').onclick=function(ev){ev.preventDefault();window.open('mailto:'+DB.refs.reportEmail+'?subject='+encodeURIComponent('بلاغ خطأ — تعلّم الصرف')+'&body='+encodeURIComponent(body()),'_blank');};}
  });
};

  var dots=LEVELS.map(function(_,i){return '<i class="'+(earned(i)?'won':(i===lv?'cur':''))+'"></i>';}).join('');
  if(lv==null){
    $('#lvbar').innerHTML='<div class="lb-t"><small>'+(ctx||'')+'</small><b>'+(title||'تَعَلَّمِ الصَّرْف')+'</b></div><div class="lb-d" aria-hidden="true">'+dots+'</div>';
    return;
  }
  $('#lvbar').innerHTML='<div class="lb-b">'+badge(lv+1,true)+'</div><div class="lb-t"><small>المستوى '+ORD[lv]+(ctx?' · '+ctx:'')+'</small><b>'+LEVELS[lv].n+'</b></div><div class="lb-d" aria-hidden="true">'+dots+'</div>';

function drawTabs(){
  tabs.innerHTML=TABS.map(function(t){
    return '<button data-t="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[t[0]]+'</svg>'+t[1]+'</button>';

function backRow(label,id){

}

/* ---------- home ---------- */
function nextAction(){
  for(var L=Math.min(S.lastLv||0,4);L<LEVELS.length;L++){
    if(!hasContent(L)){continue;}
    var ts=levelTopics(L);
    for(var j=0;j<ts.length;j++){
      if(!S.tp[ts[j].id]){return {lv:L,label:((S.solved||Object.keys(S.tp).length)?'تابع: ':'ابدأ: ')+ts[j].title,sub:'المستوى '+ORD[L]+' · '+LEVELS[L].n,fn:(function(l,i){return function(){lesson(l,i,0);};})(L,j)};}
    }
    if(!S.m[L]){return {lv:L,label:'اختبار المستوى '+ORD[L],sub:'المستوى '+ORD[L]+' · '+LEVELS[L].n,fn:(function(l){return function(){startSession({mode:'test',lv:l});};})(L)};}
  }
  return null;
}
function dueCount(){var n=0,d=dayNum();for(var k in S.srs){if(S.srs[k].d<=d){n++;}}return n;}

  var na=nextAction(),lvShow=na?na.lv:0;

    (S.plc!=null?'<button class="btn ghost" id="plc2">أعد اختبار القدرات</button>':'');
