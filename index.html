/* ---------- practice sessions ---------- */
var Q=null,TEST_N=20,TOPIC_N=20;
function topicQs(lv,ti){
  var T=CONTENT[lv].topics[ti];
  return expand(T.qs||[]).map(function(q){if(!q.sk&&T.sk){q.sk=T.sk;}q.tp=T.id;return q;});
}
function startSession(o){
  var qs,title;
  if(o.mode==='topic'){qs=shuffle(topicQs(o.lv,o.ti)).slice(0,TOPIC_N);title='تدريب: '+CONTENT[o.lv].topics[o.ti].title;}
  else if(o.mode==='mist'){qs=shuffle(S.mist.map(function(m){return JSON.parse(JSON.stringify(m.q));})).slice(0,10);title='تدريب علاجي';}
  else{
    var per=Math.ceil(TEST_N/CONTENT[o.lv].topics.length)+1,all=[];
    CONTENT[o.lv].topics.forEach(function(t,ti){all=all.concat(shuffle(topicQs(o.lv,ti)).slice(0,per));});
    (CONTENT[o.lv].extra?expand(CONTENT[o.lv].extra):[]).forEach(function(q){all.push(q);});
    qs=shuffle(all).slice(0,TEST_N);title='اختبار المستوى';
  }
  if(!qs.length){home();return;}
  Q={mode:o.mode,lv:o.lv,ti:o.ti,qs:qs,i:0,score:0,miss:{},title:title};
  tabs.hidden=true;if(o.lv!=null){S.lastLv=o.lv;}
  renderQ();
}
function renderQ(){
  clearTimers();
  setBar(Q.lv==null?0:Q.lv,Q.title);
  var q=Q.qs[Q.i],total=Q.qs.length;
  view.innerHTML='<div class="sess"><div class="top"><button class="x" id="quit" aria-label="خروج من التدريب">×</button>'+
    '<div class="bar"><i style="width:'+(Q.i/total*100)+'%"></i></div><span class="cnt">'+num(Q.i+1)+'/'+num(total)+'</span></div>'+
    '<div class="card qcard"></div></div>';
  view.scrollTop=0;
  $('#quit').onclick=function(){if(Q.mode==='mist'){mistScreen();}else{levelScreen(Q.lv);}};
  var last=Q.i===total-1;
  mountQ($('.qcard',view),q,{
    nextLabel:last?'عرض النتيجة':'السؤال التالي',
    onEnd:function(ok){
      if(ok){Q.score++;}else if(q.tp){Q.miss[q.tp]=(Q.miss[q.tp]||0)+1;}
      S.solved++;recSkill(q.sk,ok);recMist(q,ok);touchDay();save();
    },
    onNext:function(){if(last){result();}else{Q.i++;renderQ();}}
  });
}
function result(){
  var total=Q.qs.length,pct=Math.round(Q.score/total*100),lv=Q.lv;
  var ok85=Q.score/total>=MASTERY,mastered=false,head='';

  else if(Q.mode==='test'){head='<h2>'+(pct>=70?'اقتربت من الإتقان':'لا بأس، تابع التعلّم')+'</h2><p class="muted">الإتقان عند '+num(Math.round(MASTERY*100))+'٪. يمكنك مراجعة الدروس ثم إعادة الاختبار متى شئت، ولا شيء يمنعك من المتابعة.</p>';}
  else if(Q.mode==='topic'){head='<h2>'+(ok85?'أتقنت هذا الدرس ★':(pct>=70?'أحسنت، اقتربت':'راجع الدرس وأعد المحاولة'))+'</h2>';}
  else{head='<h2>'+(pct>=70?'أحسنت!':'واصل التدريب')+'</h2>';}
  var rev='';

    }).join('')+'</div>';

    '<p>أجبتَ إجابة صحيحة عن <b>'+num(Q.score)+'</b> من <b>'+num(total)+'</b> أسئلة.</p>'+head+rev+
    '<div class="row2" style="width:100%"><button class="btn ghost" id="again">أعد التدريب</button><button class="btn primary" id="hm">'+(Q.mode==='mist'?'أخطائي':(mastered&&lv<4&&hasContent(lv+1)?'المستوى التالي':'العودة إلى المستوى'))+'</button></div></div>';
  view.scrollTop=0;
  $('#again').onclick=function(){if(Q.mode==='mist'){startSession({mode:'mist'});}else{startSession({mode:Q.mode,lv:Q.lv,ti:Q.ti});}};
  $('#hm').onclick=function(){if(Q.mode==='mist'){mistScreen();}else if(mastered&&lv<4&&hasContent(lv+1)){levelScreen(lv+1);}else{levelScreen(lv);}};
  $$('.rv',view).forEach(function(b){b.onclick=function(){lesson(+b.dataset.l,+b.dataset.t,0);};});
}

/* ---------- radar ---------- */
function radar(vals){
  var cx=170,cy=150,R=98,N=vals.length,ns='',i;
  function pt(k,r){var a=-Math.PI/2+2*Math.PI*k/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  [0.25,0.5,0.75,1].forEach(function(f){
    ns+='<polygon class="g" points="'+vals.map(function(_,k){return pt(k,R*f).join(',');}).join(' ')+'"/>';
  });
  vals.forEach(function(v,k){var p=pt(k,R);ns+='<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>';});
  ns+='<polygon class="pl" points="'+vals.map(function(v,k){return pt(k,R*(v.v==null?0.02:v.v)).join(',');}).join(' ')+'"/>';
  vals.forEach(function(v,k){
    var p=pt(k,R*(v.v==null?0.02:v.v));ns+='<circle class="'+(v.v==null?'na':'dot')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>';
    var l=pt(k,R+22),anc=l[0]<cx-8?'end':(l[0]>cx+8?'start':'middle');
    ns+='<text x="'+l[0]+'" y="'+(l[1]+4)+'" text-anchor="'+anc+'">'+v.n+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="خريطة القدرات">'+ns+'</svg>';
}
function skillVals(src){
  return SKILLS.map(function(s){var v=src[s.id];return {n:s.n,v:v&&v[1]?v[0]/v[1]:null,st:v};});
}
function barsH(vals){
  return vals.map(function(v){
    return '<div class="rbar"><span class="lbl">'+v.n+'</span><div class="meter"><i style="width:'+(v.v==null?0:Math.round(v.v*100))+'%"></i></div><span class="v">'+(v.v==null?'—':num(Math.round(v.v*100))+'٪')+'</span></div>';
  }).join('');
}

/* ---------- placement test ---------- */
function placement(){
  clearTimers();
  tabs.hidden=true;setBar(null,'اختبار القدرات','تَعَلَّمِ الصَّرْف');
  view.innerHTML='<div class="top"><button class="x" id="quit" aria-label="إغلاق">×</button><h3 style="margin:0;flex:1">اختبار القدرات</h3></div>'+
    '<section class="hero"><h2>سنبدأ بأسئلة سهلة</h2><p class="muted">في كل مرحلة خمسة أسئلة؛ إن أصبتَ أربعة انتقلنا إلى الأصعب. اضغط «لا أعرف» متى لم تعرف الجواب، فلا عقوبة عليك؛ الهدف أن نعرف من أين نبدأ بك. إن ضغطتَ «لا أعرف» مرتين في مرحلة واحدة ننهي الاختبار مبكراً لنوفّر وقتك. يمكنك إعادة الاختبار في أي وقت.</p>'+
    '<button class="btn primary" id="go">ابدأ</button></section>';
  $('#quit').onclick=function(){go('home');};
  $('#go').onclick=function(){runPlacement();};
}
function runPlacement(){
  var st={L:0,k:0,ok:0,idk:0,per:[],sk:{},asked:0,wrong:[],qs:null};
  function block(){
    st.qs=shuffle(DB.diag.filter(function(d){return d.lv===st.L;})).slice(0,5);st.k=0;st.ok=0;st.idk=0;
  }
  function ask(){
    var d=st.qs[st.k],q=JSON.parse(JSON.stringify(d.q));q.sk=d.sk;q.noMist=false;
    view.innerHTML='<div class="sess"><div class="top"><button class="x" id="quit" aria-label="خروج">×</button><div class="bar"><i style="width:'+Math.min(100,(st.asked/25)*100)+'%"></i></div><span class="cnt">'+num(st.asked+1)+'</span></div><div class="card qcard"></div><div class="tap">لن تظهر الإجابة الصحيحة الآن؛ سترى أخطاءك مع شرحها في النتيجة.</div></div>';
    $('#quit').onclick=function(){go('home');};
    mountQ($('.qcard',view),q,{silent:true,idk:true,noHint:true,onEnd:function(ok,s){
      st.asked++;
      var e=st.sk[d.sk]||(st.sk[d.sk]=[0,0]);e[1]++;if(ok){e[0]++;st.ok++;}else{st.wrong.push({q:q,idk:s.idk});}
      if(s.idk){st.idk++;}
      later(next,350);
    }});
  }
  function next(){
    st.k++;
    var early=st.idk>=2;
    if(st.k>=st.qs.length||early){
      st.per[st.L]=[st.ok,st.k];
      var pass=!early&&st.ok>=4;
      if(pass&&st.L<4){st.L++;block();ask();return;}
      finish(pass?4:st.L,pass);
      return;
    }
    ask();
  }
  function finish(rec,allPassed){
    S.rec=rec;
    S.plc={per:st.per,sk:st.sk,rec:rec,d:today()};
    for(var k in st.sk){var a=S.sk[k]||(S.sk[k]=[0,0]);a[0]+=st.sk[k][0];a[1]+=st.sk[k][1];}
    st.wrong.forEach(function(w){recMist(w.q,false);});
    S.lastLv=hasContent(rec)?rec:0;save();
    setBar(rec,'نتيجة الاختبار');
    var vals=skillVals(st.sk),strong=vals.filter(function(v){return v.v!=null&&v.v>=0.8;}).map(function(v){return v.n;}),weak=vals.filter(function(v){return v.v!=null&&v.v<0.6;}).map(function(v){return v.n;});
    var passed=[];st.per.forEach(function(p,i){if(p&&(i<rec||allPassed)){passed.push('«'+LEVELS[i].n+'» ('+num(p[0])+' من '+num(p[1])+')');}});
    var failed=(!allPassed&&st.per[rec])?'وتعثّرتَ في مستوى «'+LEVELS[rec].n+'» ('+num(st.per[rec][0])+' من '+num(st.per[rec][1])+').':'';
    var reason=(passed.length?'اجتزتَ '+(passed.length>1?'مستويات ':'مستوى ')+passed.join(' و')+'. ':'لم تكتمل إجاباتك الصحيحة في المستوى الأول بعد. ')+failed+
      (strong.length?' أنت قوي في: '+strong.join('، ')+'.':'')+(weak.length?' ويحتاج إلى تقوية: '+weak.join('، ')+'.':'');
    var soon=!hasContent(rec);
    var html='<h2>نتيجة الاختبار</h2><section class="hero"><span class="eyebrow">ننصحك بالبدء من</span><div class="big">'+LEVELS[rec].n+'</div><p class="muted">'+LEVELS[rec].d+'</p><p><b>سبب التوصية:</b> '+reason+'</p>'+
      (soon?'<div class="tip">محتوى هذا المستوى قيد الإعداد، فننصحك بمراجعة «التأسيس» ريثما يكتمل، خاصة ما ضعفتَ فيه.</div>':'')+
      '<button class="btn primary" id="st">'+(soon?'افتح التأسيس':'ابدأ من هذا المستوى')+'</button><button class="btn ghost" id="oth">اختر مستوى آخر</button></section>'+
      '<section class="card stack"><h3 style="margin:0">خريطة قدراتك</h3>'+radar(vals)+barsH(vals)+'<small class="muted">المحاور الرمادية لم يبلغها الاختبار.</small></section>';
    if(st.wrong.length){
      html+='<section class="card stack"><h3 style="margin:0">أسئلة أخطأتَ فيها أو لم تعرفها ('+num(st.wrong.length)+')</h3><ul class="lst">'+st.wrong.slice(0,12).map(function(w){
        var q=w.q,ans=q.o?q.o[q.a]:'';
        return '<li>'+tx(q.p||'')+'<br><b>الصواب:</b> '+ans+'<br><small class="muted">'+tx(q.why||'')+'</small></li>';
      }).join('')+'</ul><small class="muted">أُضيفت إلى «أخطائي» لتتدرب عليها لاحقاً.</small></section>';
    }
    html+='<button class="btn ghost" id="hm">الرئيسية</button>';
    view.innerHTML=html;view.scrollTop=0;
    $('#st').onclick=function(){levelScreen(soon?0:rec);};
    $('#oth').onclick=function(){go('levels');};
    $('#hm').onclick=function(){go('home');};
  }
  block();ask();
}
